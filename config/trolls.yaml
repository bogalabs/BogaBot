# ==========================================================================
# Detector de trolls de BogaBot
# --------------------------------------------------------------------------
# Editá este archivo para ajustar qué cuenta como trolleada SIN tocar código
# (reiniciá el bot para que tome los cambios). Como el ranking troll se
# calcula al vuelo, un cambio acá también recalcula el historial.
#
# Cómo funciona:
#   1. Después de cada partida, cada regla de abajo mira las stats del
#      jugador. Si la "cometió", le suma un cargo con sus puntos troll.
#   2. Los puntos se multiplican por `ranked_multiplier` si era ranked
#      (Solo/Duo o Flex) y por `win_multiplier` si igual ganaron (lo llevaron
#      de mochila).
#   3. Según el total:
#        >= levels.troll   -> 🚨 ALERTA TROLL en el canal de trolls
#        >= levels.papelon -> 💀 PAPELÓN HISTÓRICO en #general
#      Por debajo de `troll` no se avisa aparte, pero igual suma al ranking
#      troll (/trolls) y se ve en el aviso de partida terminada.
#
# Reglas: cada una tiene `points` y sus umbrales. Un umbral con sufijo
# `_aram` o `_chaos` pisa al general en ese modo (chaos = URF, One for All,
# Nexus Blitz, etc). Para apagar una regla: `enabled: false`. Las reglas que
# no estén listadas acá usan los valores por defecto del código
# (src/bogabot/trolls/rules.py). `/trolls-reglas` muestra lo que está activo.
# ==========================================================================

version: 1

levels:
  troll: 6      # desde acá se avisa en el canal de trolls
  papelon: 18   # desde acá es PAPELÓN HISTÓRICO y va a #general (solo lo muy fuerte)

ranked_multiplier: 1.25  # trollear en ranked duele más
win_multiplier: 0.5      # si ganaron igual, el daño fue menor
alert_max_age_hours: 36  # partidas más viejas (bot caído, alguien recién vinculado) no se avisan

# Índice troll: lo que ordena el ranking (/trolls, recap diario, Troll de la
# semana). Es el promedio de puntos troll POR PARTIDA, así jugar mucho no
# pesa: el que la trollea fuerte en 2 partidas queda arriba del que jugó 18
# y trolleó 2. Dos ajustes para que no lo decida la suerte:
index:
  # Cada jugador arranca con esta cantidad de partidas "fantasma" que valen
  # el promedio del grupo en el período. Con pocas partidas el índice queda
  # cerca del promedio del grupo y se despega a medida que juega: 1 partida
  # mala suelta no te corona, 2 muy malas sí. 0 = promedio puro.
  prior_games: 2
  # Tope de puntos de una sola partida dentro del índice (el papelón igual
  # se avisa con todos sus puntos): un desastre aislado no define la semana.
  max_game_points: 30

rules:
  # 🍽️ Muchas muertes y KDA < 1. +1 cada `extra_every` muertes de más (hasta `max_extra`).
  feeder:           { points: 3, min_deaths: 10, min_deaths_aram: 14, min_deaths_chaos: 16, max_kda: 1.0, extra_every: 2, max_extra: 3 }
  # 📉 KDA menor a max_kda con al menos min_deaths muertes (no se suma si ya es feeder).
  tragic_kda:       { points: 2, max_kda: 0.5, min_deaths: 5, min_deaths_aram: 8, min_deaths_chaos: 8 }
  # 👻 0 kills y 0 asistencias (si el equipo hizo al menos min_team_kills).
  ghost:            { points: 5, min_minutes: 12, min_team_kills: 5 }
  # 🕊️ 0 kills en una partida de al menos min_minutes (no aplica a supports).
  pacifist:         { points: 1, min_minutes: 20 }
  # 🩸 Primera muerte de la partida; +early_bonus si fue antes de early_minute.
  first_blood:      { points: 1, early_minute: 3, early_bonus: 1 }
  # ⏰ Muertes antes del minuto 10.
  early_deaths:     { points: 2, min_deaths: 3 }
  # 🚜 Oro abajo contra el rival de línea al minuto 15.
  lane_gap:         { points: 2, min_deficit: 2500, min_deficit_support: 1500 }
  # 🎁 Muertes a manos del rival de línea.
  lane_delivery:    { points: 2, min_deaths: 4 }
  # 🪶 % del daño a campeones de su equipo (no aplica a supports). 0.10 = 10%.
  low_damage:       { points: 2, max_share: 0.10, min_minutes: 15 }
  # 🏝️ Participación en kills (0.20 = 20%) si el equipo hizo al menos min_team_kills.
  low_kp:           { points: 2, max_kp: 0.20, max_kp_aram: 0.30, min_team_kills: 10 }
  # 🙈 Vision score por minuto (a los supports se les exige min_per_min_support).
  blind:            { points: 1, min_per_min: 0.35, min_per_min_support: 1.0, min_minutes: 20 }
  # 🧿 Ni un control ward en una partida de al menos min_minutes.
  no_control_wards: { points: 1, min_minutes: 25 }
  # 🌾 Farm por minuto (minions + jungla) según rol.
  farm_allergy:     { points: 1, min_cs_per_min: 4.0, min_cs_per_min_jungle: 3.5, min_minutes: 15 }
  # ⚰️ Fracción de la partida muerto (0.25 = 25%); +severe_bonus desde severe_share.
  tombstone:        { points: 2, min_share: 0.25, severe_share: 0.35, severe_bonus: 1 }
  # ⚓ Murió más que los otros 4 de su equipo juntos (con al menos min_deaths).
  team_anchor:      { points: 2, min_deaths: 7 }
  # 🤖 Muertes sin campeón asesino (torre, minions, monstruos).
  executed:         { points: 1, min_deaths: 2 }
  # 💸 Items vendidos en la partida (normal: 1-3; muchos = inteo).
  item_seller:      { points: 4, min_items: 6 }
  # 🏚️ Estructuras de la base (inhibidores, torres del nexo, el nexo) perdidas
  # mientras él estaba vivo y lejos de la base. Solo derrotas.
  base_absent:      { points: 4, min_structures: 2 }
  # 💥 Murió primero de su equipo y en menos de 1 minuto perdieron Barón/Ancestral/nexo.
  throw:            { points: 3, min_throws: 1, repeat_bonus: 1 }
  # 💤 Minutos seguidos quieto, vivo y sin ganar experiencia.
  afk:              { points: 5, min_minutes: 3 }
  # 💰 Muertes con más de 3.000 de oro sin gastar encima.
  hoarder:          { points: 1, min_deaths: 2 }
  # 🏳️ Derrota por rendición antes de max_minutes (solo Grieta).
  early_ff:         { points: 2, max_minutes: 20 }
  # 🧹 Derrota con esta diferencia de kills o más.
  stomped:          { points: 1, min_gap: 20, min_gap_aram: 25, min_gap_chaos: 30 }
  # ❓ Pings de "?" tirados.
  pinger:           { points: 1, min_pings: 15 }
  # 🥄 Puesto en Arena desde el cual se considera último.
  arena_last:       { points: 2, min_placement: 8 }
